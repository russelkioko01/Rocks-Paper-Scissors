<!DOCTYPE html>
<html>
  <head>
    <title>
      ROCK PAPER SCISSORS
    </title>
    <link rel="stylesheet" 
    href="Styles/12-rock-paper-scissors .css">
    <style>
      
      
    </style>
  </head>

  <body>
    <p class="title">
      Rock Paper Scissors
    </p>
    <button class="move-button js-button-rock">
      <img src="image/rock-emoji.png">

    </button>
    <button class="move-button js-button-paper">
      <img src='image/paper-emoji.png'>

    </button>
    <button class="move-button js-button-scissors">
      <img src="image/scissors-emoji.png">

    </button>
    
   
    
    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-button js-rest-button" onclick="
      score.Wins=0;
      score.Loses=0;
      score.Ties=0;
      localStorage.removeItem('score');
      updateScoreElement();
    ">
      Reset Score
    </button>
    <button class="auto-play js-auto-play-button" onclick="
      autoPlay();
    ">
      Auto Play
    </button>
    <script src="scripts/12-rock-paper-scissors.js">
    </script>
  </body>
</html>
